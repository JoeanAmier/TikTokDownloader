name: Feature request
description: 功能优化建议
assignees:
  - JoeanAmier

body:
  - type: textarea
    id: feature-request
    attributes:
      label: 功能请求
      description: |
        请清晰、简洁地描述您希望改进的功能或需要解决的问题，并说明当前使用过程中遇到的不便。
        
        Please provide a clear and concise description of the feature you would like to improve or the problem you would like to solve, including any difficulties you currently encounter.
    validations:
      required: true

  - type: textarea
    id: expected-solution
    attributes:
      label: 描述您希望的解决方案
      description: |
        请描述您希望如何改进该功能，以及您期望达到的效果。
        
        Please describe how you would like the feature to be improved and what outcome you expect.
    validations:
      required: true

  - type: textarea
    id: alternative-solutions
    attributes:
      label: 描述您考虑过的替代方案
      description: |
        请描述您考虑过的其他解决方案、替代方式或相关功能。
        
        Please describe any alternative solutions, approaches, or related features you have considered.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: |
        请提供任何有助于理解该需求的补充信息，例如：使用场景、具体示例、截图、相关链接等。
        
        Please provide any additional information that may help us understand the request, such as use cases, specific examples, screenshots, or relevant links.
    validations:
      required: false
