name: Bug report
description: 报告项目问题
assignees:
  - JoeanAmier

body:
  - type: textarea
    id: bug-description
    attributes:
      label: 问题描述
      description: |
        请清晰、简洁地描述您遇到的问题，并说明问题发生的具体情况。
        
        Please provide a clear and concise description of the issue, including what happened and under what circumstances.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 重现步骤
      description: |
        请提供能够稳定重现该问题的操作步骤。
        
        Please provide the steps required to consistently reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 预期结果
      description: |
        请描述您认为正常情况下应该发生的结果。
        
        Please describe what you expected to happen under normal circumstances.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: |
        请提供任何有助于定位和解决问题的补充信息，例如：操作系统、运行方式、相关配置、错误截图、运行日志等。
        
        Please provide any additional information that may help us identify and resolve the issue, such as your operating system, runtime mode, relevant configuration, screenshots, or logs.
        
        请注意：提交配置文件、日志或其他内容前，请务必删除 Cookie、Token 等敏感信息。
        
        Please note: Before submitting configuration files, logs, or other content, make sure to remove cookies, tokens, and other sensitive information.
